# Codemagic 构建配置：把「我要报告」iOS 工程打成 IPA 并上传 TestFlight（无需本机 Mac）
#
# 签名范式对齐已跑通的 dice-cup-ios / img-compress-ios：
#   environment.ios_signing + xcode-project use-profiles 自动匹配证书/描述文件；
#   archive 命令【不】加 CODE_SIGN_STYLE / DEVELOPMENT_TEAM
#   （会与 use-profiles 设的 Manual 签名冲突，旧工程踩过此坑）。
# Team ID 已写死在 project.yml(DEVELOPMENT_TEAM=Z56ZQ7X7BR) 与下方 ExportOptions，无需环境变量。
# TestFlight 上传走 Codemagic 官方 publishing 块（Xcode 26 上 altool 已移除，不能用脚本方式）。
#
# 前置（Codemagic 网页，只做一次）：
#   1) Code signing → iOS certificates & provisioning profiles
#      上传 Apple Distribution 证书(.p12) + 描述文件「BaoGao AppStore」。
#      ⚠️ 描述文件必须为 com.qianfengxing.baogao 新建（复用现有 Distribution 证书即可），
#         不能复用 dicecup / imgcompress / dualcamrecorder 的描述文件（绑定了各自的 bundle id）。
#   2) App Store Connect 上传凭证：publishing.app_store_connect 直接给 api_key/key_id/issuer_id
#      三个字段（不写 auth: 键），读环境变量组 app_store_credentials 里的
#      APP_STORE_CONNECT_PRIVATE_KEY / _KEY_IDENTIFIER / _ISSUER_ID（旧工程已建，标准命名）。
#      这是官方文档的 API-key 自包含写法；比 auth: integration（要在 workflow 下补
#      integrations 块且写对集成名）更稳。

workflows:
  ios-build:
    name: BaoGao iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
      groups:
        - app_store_credentials        # App Store Connect API Key 组（旧工程已建，复用）
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.qianfengxing.baogao
    scripts:
      - name: 安装 XcodeGen
        script: |
          set -e
          brew install xcodegen || true
      - name: 生成 Xcode 工程
        script: xcodegen generate
      - name: 设置签名（读取 Code signing 里上传的证书/描述文件）
        script: xcode-project use-profiles
      - name: 构建并归档
        script: |
          set -e
          xcodebuild archive \
            -project BaoGao.xcodeproj \
            -scheme BaoGao \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/BaoGao.xcarchive" \
            -destination "generic/platform=iOS" \
            CURRENT_PROJECT_VERSION="$(date +%s)"
      - name: 导出 ipa
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          EXPORT_PLIST="$HOME/export_options.plist"
          if [ ! -f "$EXPORT_PLIST" ]; then
            cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>Z56ZQ7X7BR</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.qianfengxing.baogao</key><string>BaoGao AppStore</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
            EXPORT_PLIST="$CM_BUILD_DIR/ExportOptions.plist"
          fi
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/BaoGao.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$EXPORT_PLIST"
    artifacts:
      - $CM_BUILD_DIR/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        # 直接用环境变量组 app_store_credentials 里的标准 ASC API 变量（自包含，不写 auth: 键）
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
